# Virtual workspace for the SGX transaction-order-guarantor.
#
#   crates/tog-proto    wire protocol shared by enclave <-> clients (pure, no C)
#   crates/tog-core     the TCB: pure-Rust mempool + tip ordering (unit-tested)
#   crates/tog-enclave  the SGX enclave binary (plaintext listener; runs in a
#                       real enclave, plaintext dev server on a normal host)
#   crates/tog-client   test/reference client (+ dev stub attestation)
#
# Reads (eth_*) are NOT proxied here — clients call the builder directly for
# those; only transaction submission goes (attested) to the enclave. That keeps
# any untrusted relay out of the ingestion path (censorship resistance).
#
# See README.md for architecture, build & SGX-host setup.
[workspace]
resolver = "2"
members = [
    "crates/tog-proto",
    "crates/tog-core",
    "crates/tog-enclave",
    "crates/tog-client",
]
