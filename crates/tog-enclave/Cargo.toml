[package]
name = "tog-enclave"
version = "0.1.0"
edition = "2024"

[dependencies]
tog-core = { path = "../tog-core" }
tog-proto = { path = "../tog-proto" }
# `Bytes`/`B256` types at the protocol edge; `hex` for 0x string conversion.
# Both are pure Rust and compile for the SGX target. The transport is currently
# plaintext on all targets (see src/transport.rs), so there are no TLS deps.
alloy-primitives = { version = "1.0.23", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Enclave layout consumed by `ftxsgx-elf2sgxs` (and the cargo-sgx runner).
# Tune these to your box: heap must hold the pool; `threads` caps concurrent
# connections because each SGX thread needs a preallocated TCS.
[package.metadata.fortanix-sgx]
heap-size = 2147483648   # 2 GiB  (requires SGX2 / large EPC; drop to ~64 MiB on SGX1)
stack-size = 262144      # 256 KiB per thread
threads = 16             # max concurrent enclave threads == max in-flight conns
debug = true             # set false for production (enables enclave debug)
