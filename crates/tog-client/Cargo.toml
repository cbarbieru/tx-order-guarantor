[package]
name = "tog-client"
version = "0.1.0"
edition = "2024"

# A test/reference client for the enclave. Plaintext transport only (matching the
# enclave today). The enclave always opens with a dev stub attestation, which the
# client reads and surfaces. A real attested-transport verifier is future work.
[dependencies]
tog-proto = { path = "../tog-proto" }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Used to synthesize sample signed transactions for `demo` / testing.
alloy-primitives = { version = "1.0.23", default-features = false }
alloy-consensus = { version = "1.0.23", default-features = false, features = ["k256"] }
alloy-eips = { version = "1.0.23", default-features = false }
alloy-signer = "1.0.23"
alloy-signer-local = "1.0.23"

[[bin]]
name = "tog-client"
path = "src/main.rs"
