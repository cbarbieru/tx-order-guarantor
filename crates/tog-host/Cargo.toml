[package]
name = "tog-host"
version = "0.1.0"
edition = "2024"

# The UNTRUSTED side. Runs outside the enclave on a normal target, keeps the
# heavy/async stack (tokio + jsonrpsee), and does only one job: proxy the
# read-only `eth_*` methods through to the builder. It is deliberately NOT in
# the integrity path for ordering — `eth_sendRawTransaction`,
# `tog_getRawTransactions` and `tog_getBestTransactionHashes` go straight to the
# enclave directly and never pass through here.
[dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
jsonrpsee = { version = "0.25.1", features = ["server", "macros", "http-client", "client-core"] }
